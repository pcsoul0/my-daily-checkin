name: PCBETA签到任务
on:
  schedule:
  #   - cron: '15 4 * * *'  # 如需纳入每日调度可放开（北京时间 12:15）
  workflow_dispatch:      # 支持手动触发

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TZ: Asia/Shanghai      # 全局设为北京时间
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 执行签到
        env:
          PCBETA_COOKIE: ${{ secrets.PCBETA_COOKIE }}
        run: python pcbeta.py
        continue-on-error: true

      - name: PushPlus 通知
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python daily_push.py
        continue-on-error: true
