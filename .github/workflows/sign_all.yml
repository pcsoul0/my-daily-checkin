name: 每日签到总调度

# 单一调度：每天北京时间 23:51 顺序跑完全部签到任务（恩山 / 飞牛 / 智能电视网 / HIFITI
# 四个论坛 + WorkBuddy + ima + 哔哩哔哩 + 雨云），
# 各脚本把结果追加写入本地文件 checkin_results.txt（已被 .gitignore 忽略，不提交仓库），
# 最后由 daily_push.py 汇总并通过 PushPlus 推送。
# 所有签到步骤均为 continue-on-error，单个站点失败不中断后续任务；
# 成败信息统一体现在 PushPlus 推送内容中（不依赖 Actions 失败邮件）。
on:
  schedule:
    - cron: '51 15 * * *'   # UTC 15:51 = 北京时间 23:51（GitHub 定时调度实测中位延迟约 1.5 小时）
  workflow_dispatch:

# contents: write 仅为末尾「保活心跳」步骤推送 .heartbeat 所需；
# 本工作流仅由 schedule / workflow_dispatch 触发，不存在 PR 注入面。
permissions:
  contents: write

jobs:
  sign-all:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 恩山论坛签到
        env:
          ESHAN_COOKIE: ${{ secrets.ESHAN_COOKIE }}
          USER_UID: ${{ secrets.USER_UID }}
        run: python enshan.py
        continue-on-error: true

      - name: 飞牛社区签到
        env:
          FNOS_COOKIE: ${{ secrets.FNOS_COOKIE }}
        run: python fnclub.py
        continue-on-error: true

      - name: 智能电视网签到
        env:
          ZNDS_USERNAME: ${{ secrets.ZNDS_USERNAME }}
          ZNDS_PASSWORD: ${{ secrets.ZNDS_PASSWORD }}
        run: python znds.py
        continue-on-error: true

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: HIFITI 签到
        env:
          ACCOUNTS: ${{ secrets.HIFITI_ACCOUNTS }}
        run: node hifiti.js
        continue-on-error: true

      - name: WorkBuddy 签到
        env:
          WB_TOKEN: ${{ secrets.WB_TOKEN }}       # Bearer accessToken（必填）
          WB_UID: ${{ secrets.WB_UID }}           # 账号 uid（必填）
          WB_DOMAIN: www.workbuddy.cn             # 非敏感，明文即可
          WB_API_BASE: https://copilot.tencent.com
        run: python workbuddy_checkin.py
        continue-on-error: true

      - name: ima 每日登录领算力
        env:
          # refresh 模式凭据 JSON（user_id/refresh_token/token_type/static_fields），
          # 长效 30 天；脚本每次运行先调 auth_login/refresh 换新 access token，绕开 2h TTL。
          IMA_REFRESH: ${{ secrets.IMA_REFRESH }}
        run: python ima_checkin.py
        continue-on-error: true

      - name: 哔哩哔哩每日任务
        env:
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}   # Cookie 全文（必填）
          # 以下几项为非敏感配置，不设即用脚本内默认值（投币 1 枚 + 分享 + 观看）。
          # 需调整时取消注释即可：
          # TASK_CONFIG: add_coin,share_video,watch_video,manga_sign,silver2coin,link_sign
          # （live_sign 直播签到因 B 站活动下线已无实际作用，一般不开启）
          # COIN_ADD_NUM: '1'          # 每日投币数量，0 = 关闭投币
          # COIN_SELECT_LIKE: '1'      # 投币时是否同时点赞
          # COIN_VIDEO_SOURCE: ranking # 投币目标来源：ranking（默认）或 dynamic
        run: python bilibili_checkin.py
        continue-on-error: true

      # 雨云是「API Key 纯 HTTP + 不绕验证码」方案：风控命中时会判「需人工验证码」并跳过，
      # 属预期行为（详见 rainyun_checkin.py 头部说明），不视为流水线故障。
      - name: 雨云每日签到
        env:
          RAINYUN_API_KEY: ${{ secrets.RAINYUN_API_KEY }}   # 雨云后台「用户中心 → API 密钥」生成
        run: python rainyun_checkin.py
        continue-on-error: true

      - name: PushPlus 汇总通知
        if: always()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python daily_push.py
        continue-on-error: true

      # ── 保活心跳 ─────────────────────────────────────────────────────────
      # 规则：公开仓库的定时工作流若连续 60 天无「仓库活动」（即无 commit push），
      #       会被 GitHub 自动停用（官方文档 Disabling and enabling a workflow）。
      # 现状：常规运行只读代码、结果仅写本地并推送 PushPlus，不产生任何 commit，
      #       等于零活动 —— 转公开后第 60 天签到会被静默停掉。
      # 对策：每次运行检查最近一次提交时间，超过 45 天就提交一个只含时间戳的
      #       .heartbeat 文件刷新计时器。阈值取 45 而非 60，留出调度延迟余量。
      # 频率：约每 45 天 1 次，一年约 8 个 commit。
      # 另有：工作流一旦被停用，schedule 不再触发，本步骤也救不回来 —— 所以阈值必须
      #       显著小于 60 天。
      - name: 保活心跳（防 60 天无活动被停用）
        if: always()
        continue-on-error: true
        run: |
          set -eu
          LAST=$(git log -1 --format=%ct)
          NOW=$(date -u +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "最近一次提交距今 ${DAYS} 天，保活阈值 45 天"
          if [ "$DAYS" -lt 45 ]; then
            echo "未达阈值，跳过心跳提交（本次不产生 commit）"
            exit 0
          fi
          BRANCH="${GITHUB_REF_NAME}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'heartbeat at %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .heartbeat
          git add .heartbeat
          git commit -m "chore(keepalive): 定时任务存活心跳（避免 60 天无活动被自动停用）"
          git push origin "HEAD:refs/heads/${BRANCH}" || {
            echo "推送失败，rebase 后重试一次"
            git pull --rebase origin "${BRANCH}"
            git push origin "HEAD:refs/heads/${BRANCH}"
          }
          echo "心跳提交完成，计时器已重置"
